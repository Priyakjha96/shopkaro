<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopKaro</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>ShopKaro</h1>
    <input class="search" id="search" placeholder="Search products">
  </header>

  <main class="content">

    <!-- HOME -->
    <section id="screen-home">
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
      <p class="empty hidden" id="empty">No products found</p>
      <button class="load-more hidden" id="load-more">Load more</button>
    </section>

    <!-- CART -->
    <section id="screen-cart" class="hidden">
      <h2>Your cart</h2>
      <div id="cart-items"></div>
      <div id="cart-summary" class="cart-summary hidden">
        <div class="cart-total"><span>Total</span><b id="cart-total">₹0</b></div>
        <button class="primary" id="checkout-btn">Checkout</button>
      </div>
    </section>

    <!-- CHECKOUT (NAYA) -->
    <section id="screen-checkout" class="hidden">
      <h2>Checkout</h2>
      <div class="card">
        <input id="co-name" class="field" placeholder="Full name">
        <input id="co-phone" class="field" inputmode="numeric" maxlength="10" placeholder="Phone (10 digits)">
        <input id="co-address" class="field" placeholder="Address (house, street, area)">
        <input id="co-city" class="field" placeholder="City">
        <input id="co-pincode" class="field" inputmode="numeric" maxlength="6" placeholder="Pincode (6 digits)">
      </div>
      <div class="cart-summary">
        <div class="cart-total"><span>Order total</span><b id="co-total">₹0</b></div>
        <p class="muted">Payment: Cash on delivery</p>
        <button class="primary" id="place-order">Place order</button>
        <p class="error" id="co-error"></p>
        <button class="link-btn" id="back-to-cart">Back to cart</button>
      </div>
    </section>

    <!-- ORDER PLACED (NAYA) -->
    <section id="screen-confirm" class="hidden">
      <div class="card confirm">
        <h2>Order placed!</h2>
        <p class="muted" id="cf-id"></p>
        <div id="cf-items"></div>
        <div class="cart-total"><span>Total</span><b id="cf-total"></b></div>
        <p class="muted" id="cf-address"></p>
        <button class="primary" id="continue-shopping">Continue shopping</button>
      </div>
    </section>

    <!-- ACCOUNT -->
    <section id="screen-account" class="hidden">
      <div id="auth-box" class="card">
        <div class="tabs">
          <button class="tab active" id="tab-login">Login</button>
          <button class="tab" id="tab-register">Register</button>
        </div>
        <input id="name" class="field hidden" placeholder="Full name">
        <input id="email" class="field" type="email" placeholder="Email">
        <input id="password" class="field" type="password" placeholder="Password (min 6 characters)">
        <button class="primary" id="auth-submit">Login</button>
        <p class="error" id="auth-error"></p>
      </div>

      <div id="profile-box" class="card hidden">
        <h3 id="profile-name"></h3>
        <p class="muted" id="profile-email"></p>
        <p class="muted">Role: <span id="profile-role"></span></p>
        <button class="primary" id="logout-btn">Logout</button>
      </div>
    </section>

  </main>

  <div class="toast hidden" id="toast"></div>

  <nav class="bottom-nav">
    <a data-screen="home" class="active">Home</a>
    <a data-screen="cart">Cart <span class="badge hidden" id="cart-badge">0</span></a>
    <a data-screen="orders">Orders</a>
    <a data-screen="account">Account</a>
  </nav>

  <script src="/static/app.js"></script>
</body>
</html>
