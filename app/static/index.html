<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopKaro</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>ShopKaro</h1>
    <input class="search" placeholder="Search products">
  </header>

  <main class="content">
    <div class="chips">
      <span class="chip active">All</span>
      <span class="chip">Mobiles</span>
      <span class="chip">Fashion</span>
      <span class="chip">Home</span>
      <span class="chip">Books</span>
    </div>

    <div class="grid">
      <div class="product"><div class="img">Photo</div><div class="name">Cotton T-shirt</div><div class="price">₹499</div></div>
      <div class="product"><div class="img">Photo</div><div class="name">Wireless earbuds</div><div class="price">₹1,299</div></div>
      <div class="product"><div class="img">Photo</div><div class="name">Steel water bottle</div><div class="price">₹349</div></div>
      <div class="product"><div class="img">Photo</div><div class="name">Running shoes</div><div class="price">₹1,799</div></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a class="active">Home</a>
    <a>Cart</a>
    <a>Orders</a>
    <a>Account</a>
  </nav>

  <script src="/static/app.js"></script>
</body>
</html>
